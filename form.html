<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>WDD 131 | Forms | Diego Esquit</title>
    <meta name="author" content="Diego Esquit">
    <meta name="description" content="WDD 131 | Week 05 | Forms | Diego Esquit: Demonstrate I can code a form with good practices">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get" id="productForm">
            <label for="pName">Product Name <span class="requiredField">*</span>
                <select name="pName" id="pName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </label>
            <p id="ratingTitle">Overall Rating <span class="requiredField">*</span></p>
            <div id="overallRating">
                <label for="rating1"><input type="radio" name="rating" id="rating1" class="rating" value="oneStar" required>&star;</label>
                <label for="rating2"><input type="radio" name="rating" id="rating2" class="rating" value="twoStars" required>&star;&star;</label>
                <label for="rating3"><input type="radio" name="rating" id="rating3" class="rating" value="threeStars" required>&star;&star;&star;</label>
                <label for="rating4"><input type="radio" name="rating" id="rating4" class="rating" value="fourStars" required>&star;&star;&star;&star;</label>
                <label for="rating5"><input type="radio" name="rating" id="rating5" class="rating" value="fiveStars" required>&star;&star;&star;&star;&star;</label>
            </div>
                <label for="date">Date of Instalation <span class="requiredField">*</span>
                <input type="date" name="date" id="date" required>
            </label>
                <p>Which feature did you find usefull in the product?</p>
                <p>(Check all that apply)</p>
                <label class="feature" for="durabFeature"><input id="durabFeature" type="checkbox" name="durability" value="durability">Durability</label>
                <label class="feature" for="easeFeature"><input id="easeFeature" type="checkbox" name="ease" value="ease of use">Ease of Use</label>
                <label class="feature" for="performFeature"><input id="performFeature" type="checkbox" name="perform" value="performance">Performance</label>
                <label class="feature" for="designFeature"><input id="designFeature" type="checkbox" name="design" value="design" class="last">Design</label>
            <label for="writtenReview">Written Review<span class="optional">(optional)</span>
                <textarea name="review" id="writtenReview" rows="5"></textarea>
            </label>
            <label for="name">Your Name<span class="optional">(optional)</span>
                <input type="text" name="name" id="name">
            </label>
            <input type="submit" value="Post Review" id="sendReview">
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentYear"></span> ⚜️ All Rights Reserved ⚜️ Diego Esquit</p>
        <p id="lastModification"></p>
    </footer>
</body>
</html>
